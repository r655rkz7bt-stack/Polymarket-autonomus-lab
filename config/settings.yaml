      - {name: Billboard, url: "https://www.billboard.com/feed/", language: en}
      # --- Science, météo extrême, espace
      - {name: NHC (ouragans), url: "https://www.nhc.noaa.gov/index-at.xml", official: true, language: en}
      - {name: USGS séismes M4.5+, url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom", official: true, language: en}
      - {name: Space.com, url: "https://www.space.com/feeds.xml", language: en}
  x_api: {enabled: false}      # payant : interdit n°2 de CLAUDE.md
  # Relevés officiels NOAA (METAR) des stations qui tranchent les marchés de température.
  meteo_metar: {enabled: true, every_minutes: 15, max_stations: 60}   # aviationweather.gov
  # Prévisions GFS + ECMWF aux stations (stratégie meteo_prevision) ; débit limité par adresse.
  meteo_prevision: {enabled: true, every_minutes: 60}                 # api.open-meteo.com
  # Valeurs réelles (tranche gagnante des marchés météo résolus) : étalonnage par station.
  meteo_reel: {enabled: true, every_minutes: 180, days: 10}           # gamma-api.polymarket.com
  # Scores officiels des ligues (sources de résolution, chantier n°0), sans clé.
  mlb_stats: {enabled: true, every_minutes: 15}   # statsapi.mlb.com
  nhl_stats: {enabled: true, every_minutes: 15}   # api-web.nhle.com
  # Sources à CLÉ GRATUITE : actives seulement si Etienne a créé la clé (secret GitHub du même nom,
  # environnement production). Sans clé : « désactivée (pas de clé …) », aucun appel.
  football_data: {enabled: true, every_minutes: 30}   # FOOTBALL_DATA_KEY, scores Ligue des champions, championnats
  odds_api:                                           # ODDS_API_KEY ; 1 crédit par sport et par appel (500/mois gratuits)
    enabled: true
    every_minutes: 720
    regions: eu
    sports: [soccer_uefa_champs_league, americanfootball_nfl, baseball_mlb, icehockey_nhl, basketball_nba]
  guardian: {enabled: true, every_minutes: 30, queries_per_run: 5, per_query: 10}   # GUARDIAN_API_KEY
  # Archive de la source de résolution des marchés surveillés (resolution_sources.py).
  sources_resolution: {enabled: true, every_minutes: 60}

# Règles de l'arène : config/promotion.yaml (libre depuis le 15/10/2026, lu par les scripts).

dashboard:
  output_dir: site             # page statique publiée sur GitHub Pages (étape 9)
  every_minutes: 10            # GitHub Pages limite à ~10 publications/heure ; la page se recharge seule

collector:
  markets_per_cycle: 10        # marchés surveillés pour lesquels on cherche des actualités

llm:
  # Gemini (offre gratuite Google AI Studio) : actif dès qu'Etienne ajoute GEMINI_API_KEY.
  enabled: true
  provider: gemini
  model: gemini-2.5-flash      # point de départ ; s'il est retiré (404), le meilleur « flash » stable est choisi seul
  max_calls_per_day: 500       # sous le quota gratuit ; jamais de dépassement
  timeout_seconds: 40          # Gemini peut mettre plus de 15 s ; trop lent = modèle suivant
  max_retries: 0
  markets_per_cycle: 15        # avec cache : seuls les textes nouveaux sont envoyés (15/10/2026)

# Santé des stratégies (strategy_health.py, décision d'Etienne du 15/10/2026), libre :
# mise réduite tant que les prévisions ne sont pas prouvées meilleures que le marché, et
# suspension d'une stratégie gagnante avant frais mais perdante après.
sante_strategies:
  min_resolved: 20          # prévisions jugées (marchés réglés) avant de conclure
  base: 0.5                 # part de la mise habituelle tant que rien n'est prouvé (½ Kelly)
  proven: 1.0               # prouvée meilleure que le prix du marché
  disproven: 0.25           # prouvée moins bonne
  suspension_min_closed: 20 # opérations clôturées avant de pouvoir suspendre
  outcomes_per_hour: 15     # marchés interrogés par heure pour juger les prévisions
