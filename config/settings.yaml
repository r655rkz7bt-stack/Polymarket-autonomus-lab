# Réglages généraux. Modifiable par Claude (hors garde-fous, qui sont dans risk_limits.yaml).

# Seul mode existant. Le contrôleur refuse toute autre valeur.
mode: simulation

paths:
  ledger: ledger/ledger.jsonl
  bankruptcy_lock: ledger/BANKRUPT.lock
  database: state/market.sqlite
  logs: logs
  cycle_lock: state/cycle.lock

cycle:
  bucket_minutes: 5            # sert à fabriquer des identifiants d'opération idempotents

http:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 1.0         # 1 s, 2 s, 4 s...
  min_interval_seconds: 0.2    # politesse envers les API publiques
  user_agent: "polymarket-autonomous-lab/0.1 (paper trading research; no real orders)"

scanner:
  page_size: 100               # maximum accepté par Gamma (vérifié le 14/10/2026)
  max_pages: 3
  min_horizon_minutes: 30      # horizon validé : 30 min à 3 jours
  max_horizon_hours: 72
  min_liquidity: 1000
  min_volume_24h: 1000
  max_spread: 0.05
  max_favorite_price: 0.99     # au-delà, l'issue est pratiquement connue : rien à gagner
  watchlist_size: 30
  full_snapshot_every_minutes: 30   # archiver tout le scan seulement toutes les 30 min

database:
  max_megabytes: 40

sources:
  polymarket_gamma:
    enabled: true
    base_url: https://gamma-api.polymarket.com
  polymarket_clob:
    enabled: true
    base_url: https://clob.polymarket.com
    books_batch_size: 20
  # Sources ajoutées à l'étape 5 (désactivées pour l'instant).
  polymarket_comments: {enabled: false}
  crypto_prices: {enabled: false}
  gdelt: {enabled: false}
  rss: {enabled: false}
  bluesky: {enabled: false}
  x_api: {enabled: false}      # payant : reste désactivé

llm:
  enabled: false               # aucun modèle d'IA dans le cycle par défaut
  provider: gemini
  max_calls_per_day: 0
