      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", language: en}
      - {name: BBC Technology, url: "https://feeds.bbci.co.uk/news/technology/rss.xml", language: en}
      - {name: Hacker News, url: "https://hnrss.org/frontpage", language: en}
