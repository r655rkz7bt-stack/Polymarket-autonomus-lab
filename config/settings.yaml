  x_api: {enabled: false}      # payant : interdit n°2 de CLAUDE.md

# Règles de l'arène : config/promotion.yaml (libre depuis le 15/10/2026, lu par les scripts).

dashboard:
  output_dir: site             # page statique publiée sur GitHub Pages (étape 9)
  every_minutes: 10            # GitHub Pages limite à ~10 publications/heure ; la page se recharge seule

collector:
  markets_per_cycle: 5         # marchés surveillés pour lesquels on cherche des actualités

llm:
  # Gemini (offre gratuite Google AI Studio) : actif dès qu'Etienne ajoute GEMINI_API_KEY.
  enabled: true
  provider: gemini
  model: gemini-2.5-flash      # point de départ ; s'il est retiré (404), le meilleur « flash » stable est choisi seul
  max_calls_per_day: 200       # sous le quota gratuit ; jamais de dépassement
  timeout_seconds: 40          # Gemini peut mettre plus de 15 s ; trop lent = modèle suivant
  max_retries: 0
  markets_per_cycle: 2
