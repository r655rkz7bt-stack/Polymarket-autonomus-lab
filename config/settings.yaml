# Réglages généraux. Modifiable par Claude (hors garde-fous, qui sont dans risk_limits.yaml).

# Seul mode existant. Le contrôleur refuse toute autre valeur.
mode: simulation

paths:
  ledger: ledger/ledger.jsonl
  shadow_dir: ledger/fantome   # journaux des stratégies en mode « fantome »
  bankruptcy_lock: ledger/BANKRUPT.lock
  database: state/market.sqlite
  logs: logs
  cycle_lock: state/cycle.lock

cycle:
  bucket_minutes: 5            # sert à fabriquer des identifiants d'opération idempotents
  battement_fantomes_minutes: 30   # 21/10/2026 : battement d'un fantôme inactif au plus toutes les 30 min (journaux 6× plus légers)
  reglements_par_lot: 100      # 21/10/2026 : marchés détenus lus par lots de 100 pour les règlements (723 requêtes → ~16)

# Historique des références externes (AMELIORATION n°4 du 21/10/2026) : une photo par heure des prix
# Kalshi, PredictIt, Manifold, champions, mentions, NHL et tweets rattachés à nos marchés, avec le prix
# Polymarket du même instant (table historique_references, gardée dans la sauvegarde quotidienne).
references_historique: {toutes_les_minutes: 60, garder_jours: 45}

# Ordres à cours limité posés dans le carnet (stratégies en mode « patient », limit_ticks).
# Exécutés seulement si le marché passe AU TRAVERS du prix (execution_simulator.py).
# Capital principal (17/10/2026, AMELIORATION n°6), libre : plafonds du SEUL portefeuille principal
# (les fantômes ne sont pas plafonnés : l'arène mesure chaque stratégie telle qu'elle est).
principal:
  max_mise: 0.10      # un achat ≤ 10 % du capital estimé (Kelly complet allait jusqu'à 40 %)
  max_famille: 0.40   # ≤ 40 % du capital engagé dans une même famille (météo, sport…) : paris liés

# Fantômes (23/10/2026, enquête « mises géantes ») : une mise ≤ 25 % du capital estimé du fantôme.
# Mêmes paris, taille seulement : la confiance de l'arène se mesure sur le rendement par mise.
fantomes:
  max_mise: 0.25

# Deux camps d'un même match (23/10/2026, contrôle `deux_camps`) : pas d'achat au-dessus de `prix_min`
# d'un jeton d'un marché où le portefeuille tient déjà un autre jeton payé au-dessus de ce prix.
deux_camps:
  prix_min: 0.70

# Récompenses de liquidité (option A d'Etienne, 17/10/2026, libre) : les récompenses ESTIMÉES des
# journées terminées (≥ 1 $, plafonnées à la cagnotte du marché) × prudence comptent dans le
# CLASSEMENT de l'arène, jamais dans le capital d'un fantôme. Le versement au capital public
# attend le noyau : proposals/2026-10-17_recompenses_au_capital.md.
recompenses:
  classement_arene: true
  prudence: 0.5       # estimation sans doute trop optimiste : on n'en compte que la moitié
  # Récompense de DÉTENTION (19/10/2026) : taux annuel versé par Polymarket sur la valeur des positions
  # des marchés éligibles (Gamma holdingRewardsEnabled) ; estimée comme ci-dessus (holding_rewards.py).
  detention_taux_annuel: 0.04

# Relecture avant d'acheter (enquête du 20/10/2026, experiments/enquetes/2026-10-20_carnet_perime.md) :
# si le prix de vente a chuté de plus de `chute_max` depuis le début du cycle, l'estimation de la
# stratégie est périmée → pas d'achat ce cycle-ci (sauf jambes d'arbitrage).
relecture:
  chute_max: 0.03
  sauf: [paire_oui_non, echelle_dates, coherence_match, implication_politique, marches_jumeaux, cross_market,
         outsiders_surcotes]

limit_orders:
  max_age_hours: 6            # durée de vie maximale d'un ordre posé
  max_open_per_portfolio: 60   # ordres ouverts au plus par portefeuille (tenue de marché : 25 marchés × 2, 17/10/2026)

http:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 1.0         # 1 s, 2 s, 4 s...
  min_interval_seconds: 0.2    # politesse envers les API publiques
  user_agent: "polymarket-autonomous-lab/0.1 (paper trading research; no real orders)"

scanner:
  page_size: 100               # maximum accepté par Gamma (vérifié le 14/10/2026)
  max_pages: 15                # jusqu'à 1 500 marchés lus par cycle (décision d'Etienne, 15/10/2026)
  min_horizon_minutes: 30      # horizon : 30 min à 30 jours (élargi le 15/10/2026 : marchés longs inclus)
  max_horizon_hours: 720
  min_liquidity: 1000
  min_volume_24h: 1000
  max_spread: 0.05
  max_favorite_price: 0.99     # au-delà, l'issue est pratiquement connue : rien à gagner
  watchlist_size: 150          # marchés suivis en détail (carnets, actualités) à chaque cycle
  full_snapshot_every_minutes: 30   # archiver tout le scan seulement toutes les 30 min
  holding_pages: 1             # 19/10/2026 : 100 marchés longs de plus (récompense de détention, parking_politique)
  holding_max_horizon_days: 900
  # 21/10/2026 (« réveiller les muettes », experiments/muettes.md) : 1 000 marchés longs de toutes sortes
  # (31 à 900 jours), seulement pour les stratégies qui les demandent (échelles de dates, implication
  # politique, échelles de seuils, jumeaux…). Volume du jour exigé plus bas : un marché de 2028
  # s'échange peu chaque jour, son carnet décide de toute façon de ce qui s'exécute.
  long_pages: 10
  long_max_horizon_days: 900
  long_min_volume_24h: 100
  ended_pages: 1               # 20/10/2026 : 100 marchés échus depuis 1 à 72 h (apres_echeance)
  # 21/10/2026 : marchés « mentions » (peu de volume, absents des pages normales : mots_prononces,
  # mots_nouveaux). 176 ouverts ce jour-là, 56 passent ces filtres propres (liquidité médiane 170 $).
  # 21/10/2026 (soir) : marchés « données économiques » (emplois : étiquette nfp 102964 ; CPI : étiquette cpi 101701) : 400-2 000 $ de liquidité et
  # ~0-700 $ de volume par jour, donc écartés par min_volume_24h ; `cpi_tranches` et `jobs_favori_non` ne voyaient aucun marché (0 achat, abstentions vides).
  tag_pages: {100343: {pages: 2, min_liquidity: 100, min_volume_24h: 0, max_spread: 0.10},
              102964: {pages: 1, min_liquidity: 300, min_volume_24h: 0, max_spread: 0.10},
              101701: {pages: 1, min_liquidity: 300, min_volume_24h: 0, max_spread: 0.10}}
  # Séries de sport (23/10/2026, piste « moins de cartes », experiments/pistes_sport_coherence.md) : matchs
  # d'e-sport en 2 ou 3 manches gagnantes ; seuls les marchés « Games Total » (type totals), vus par qui les demande.
  series_pages:
    10310: {types: [totals], titre_contient: ["(BO3)", "(BO5)"], min_liquidity: 0, min_volume_24h: 0, max_spread: 0.20}
    10311: {types: [totals], titre_contient: ["(BO3)", "(BO5)"], min_liquidity: 0, min_volume_24h: 0, max_spread: 0.20}
    10309: {types: [totals], titre_contient: ["(BO3)", "(BO5)"], min_liquidity: 0, min_volume_24h: 0, max_spread: 0.20}
    10369: {types: [totals], titre_contient: ["(BO3)", "(BO5)"], min_liquidity: 0, min_volume_24h: 0, max_spread: 0.20}
  ended_min_hours: 1
  ended_max_hours: 72
  max_extra_markets: 600       # marchés demandés par les stratégies (météo 100, tenue de marché 30, politique 40, sport 30, crypto 30) ; doublons comptés une fois
                               # 21/10/2026 : 320 → 600 (pages longues et filles à mots-clés, experiments/muettes.md)

database:
  max_megabytes: 40

sources:
  polymarket_gamma:
    enabled: true
    base_url: https://gamma-api.polymarket.com
  polymarket_clob:
    enabled: true
    base_url: https://clob.polymarket.com
    books_batch_size: 20
  # Étape 5 — toutes les sources gratuites actives dès le départ (décision du 15/10/2026).
  # Une source indisponible ne bloque jamais le cycle (mode dégradé, analyse partielle).
  polymarket_comments: {enabled: true, every_minutes: 15, per_event: 20}
  crypto_prices: {enabled: true, every_minutes: 5}          # Binance (source de résolution), repli Coinbase, Kraken
  # GDELT refuse souvent les IP partagées de GitHub (HTTP 429) : une requête par heure, sans
  # nouvel essai, pour ne pas allonger les cycles (décision d'Etienne, 15/10/2026).
  gdelt: {enabled: true, every_minutes: 180, queries_per_run: 1, max_retries: 0, timeout: 6, timespan: 6h}  # 19/10 : 16 s d'attente par cycle → 6 s au plus  # 17/10 : HTTP 429 à 60 min (adresse partagée de GitHub)
  bluesky: {enabled: true, every_minutes: 15, queries_per_run: 3}  # compte optionnel (BLUESKY_*)
  # Google Actualités : une recherche par marché surveillé (remplace GDELT quand il refuse).
  google_news: {enabled: true, every_minutes: 15, queries_per_run: 10, per_query: 15}
