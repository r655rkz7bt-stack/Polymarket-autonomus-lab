# Réglages généraux. Modifiable par Claude (hors garde-fous, qui sont dans risk_limits.yaml).

# Seul mode existant. Le contrôleur refuse toute autre valeur.
mode: simulation

paths:
  ledger: ledger/ledger.jsonl
  shadow_dir: ledger/fantome   # journaux des stratégies en mode « fantome »
  bankruptcy_lock: ledger/BANKRUPT.lock
  database: state/market.sqlite
  logs: logs
  cycle_lock: state/cycle.lock

cycle:
  bucket_minutes: 5            # sert à fabriquer des identifiants d'opération idempotents

# Ordres à cours limité posés dans le carnet (stratégies en mode « patient », limit_ticks).
# Exécutés seulement si le marché passe AU TRAVERS du prix (execution_simulator.py).
limit_orders:
  max_age_hours: 6             # durée de vie maximale d'un ordre posé
  max_open_per_portfolio: 30   # ordres ouverts au plus par portefeuille

http:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 1.0         # 1 s, 2 s, 4 s...
  min_interval_seconds: 0.2    # politesse envers les API publiques
  user_agent: "polymarket-autonomous-lab/0.1 (paper trading research; no real orders)"

scanner:
  page_size: 100               # maximum accepté par Gamma (vérifié le 14/10/2026)
  max_pages: 15                # jusqu'à 1 500 marchés lus par cycle (décision d'Etienne, 15/10/2026)
  min_horizon_minutes: 30      # horizon : 30 min à 30 jours (élargi le 15/10/2026 : marchés longs inclus)
  max_horizon_hours: 720
  min_liquidity: 1000
  min_volume_24h: 1000
  max_spread: 0.05
  max_favorite_price: 0.99     # au-delà, l'issue est pratiquement connue : rien à gagner
  watchlist_size: 150          # marchés suivis en détail (carnets, actualités) à chaque cycle
  full_snapshot_every_minutes: 30   # archiver tout le scan seulement toutes les 30 min
  max_extra_markets: 200       # marchés supplémentaires que les stratégies peuvent demander (météo : 100, tenue de marché : 30)

database:
  max_megabytes: 40

sources:
  polymarket_gamma:
    enabled: true
    base_url: https://gamma-api.polymarket.com
  polymarket_clob:
    enabled: true
    base_url: https://clob.polymarket.com
    books_batch_size: 20
  # Étape 5 — toutes les sources gratuites actives dès le départ (décision du 15/10/2026).
  # Une source indisponible ne bloque jamais le cycle (mode dégradé, analyse partielle).
  polymarket_comments: {enabled: true, every_minutes: 15, per_event: 20}
  crypto_prices: {enabled: true, every_minutes: 5}          # Binance (source de résolution), repli Coinbase, Kraken
  # GDELT refuse souvent les IP partagées de GitHub (HTTP 429) : une requête par heure, sans
  # nouvel essai, pour ne pas allonger les cycles (décision d'Etienne, 15/10/2026).
  gdelt: {enabled: true, every_minutes: 60, queries_per_run: 1, max_retries: 0, timespan: 3h}
  bluesky: {enabled: true, every_minutes: 15, queries_per_run: 3}  # compte optionnel (BLUESKY_*)
  # Google Actualités : une recherche par marché surveillé (remplace GDELT quand il refuse).
  google_news: {enabled: true, every_minutes: 15, queries_per_run: 10, per_query: 15}
  rss:
    enabled: true
    every_minutes: 15
    # Flux fournis par les médias et institutions eux-mêmes (aucune aspiration de pages).
    # Un flux en panne ou déplacé est ignoré sans gêner les autres. official: true = source officielle.
    # Retirés le 15/10/2026 : ESPN (HTTP 202, protection anti-robots) et FDA (HTTP 404) refusent les
    # serveurs de GitHub alors qu'ils répondent ailleurs : blocage, on ne contourne pas.
    # Également retirés plus tôt : BLS, CNBC (« Access Denied »), Dot Esports (flux supprimé).
    feeds:
      # --- Actualité générale et géopolitique
      - {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", language: en}
      - {name: BBC Politics, url: "https://feeds.bbci.co.uk/news/politics/rss.xml", language: en}
      - {name: NYT World, url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", language: en}
      - {name: NYT Politics, url: "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml", language: en}
      - {name: Guardian World, url: "https://www.theguardian.com/world/rss", language: en}
      - {name: Guardian US Politics, url: "https://www.theguardian.com/us-news/us-politics/rss", language: en}
      - {name: NPR Politics, url: "https://feeds.npr.org/1014/rss.xml", language: en}
      - {name: Politico, url: "https://rss.politico.com/politics-news.xml", language: en}
      - {name: The Hill, url: "https://thehill.com/feed/", language: en}
      - {name: Fox News Politics, url: "https://moxie.foxnews.com/google-publisher/politics.xml", language: en}
      - {name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", language: en}
      - {name: DW, url: "https://rss.dw.com/rdf/rss-en-all", language: en}
      - {name: France 24, url: "https://www.france24.com/en/rss", language: en}
      - {name: Le Monde, url: "https://www.lemonde.fr/rss/une.xml", language: fr}
      - {name: France Info, url: "https://www.franceinfo.fr/titres.rss", language: fr}   # nouvelle adresse (oct. 2026)
      # --- Sources officielles
      - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", official: true, language: en}
      - {name: BCE, url: "https://www.ecb.europa.eu/rss/press.html", official: true, language: en}
      - {name: Banque d'Angleterre, url: "https://www.bankofengland.co.uk/rss/news", official: true, language: en}
      - {name: Maison-Blanche, url: "https://www.whitehouse.gov/news/feed/", official: true, language: en}
      - {name: SEC, url: "https://www.sec.gov/news/pressreleases.rss", official: true, language: en}
      - {name: ONU, url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml", official: true, language: en}
      - {name: NASA, url: "https://www.nasa.gov/news-release/feed/", official: true, language: en}
      # --- Économie et marchés
      - {name: BBC Business, url: "https://feeds.bbci.co.uk/news/business/rss.xml", language: en}
      - {name: MarketWatch, url: "https://feeds.marketwatch.com/marketwatch/topstories/", language: en}
      - {name: WSJ Markets, url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml", language: en}
      - {name: NYT Business, url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml", language: en}
      # --- Crypto
      - {name: CoinDesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", language: en}
      - {name: Cointelegraph, url: "https://cointelegraph.com/rss", language: en}
      - {name: Decrypt, url: "https://decrypt.co/feed", language: en}
      - {name: The Block, url: "https://www.theblock.co/rss.xml", language: en}
      - {name: Bitcoin Magazine, url: "https://bitcoinmagazine.com/feed", language: en}
      # --- Sport
      - {name: BBC Sport, url: "https://feeds.bbci.co.uk/sport/rss.xml", language: en}
      - {name: BBC Football, url: "https://feeds.bbci.co.uk/sport/football/rss.xml", language: en}
