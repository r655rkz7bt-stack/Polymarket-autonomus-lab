# Mise en page du tableau de bord — LIBRE : le chercheur la règle (décision d'Etienne, 17/10/2026).
# Ce que voit Etienne en premier doit être ce qui compte le plus pour lui (il lit sur iPad / téléphone).
# Méthode et garde-fous : docs/TABLEAU_DE_BORD.md. Aperçu avant publication : scripts/apercu_dashboard.py.

# Ordre des blocs, du haut vers le bas. Identifiants possibles : organisme, resume, principal, aujourdhui, arene, entonnoir, capital,
# positions, ordres-poses, decisions-recentes, journal, systeme.
# Un bloc absent de la liste garde sa place après les blocs listés.
# 21/10/2026 (demande d'Etienne) : la courbe du capital juste sous le cœur.
ordre: [organisme, capital, resume, principal, aujourdhui, arene, entonnoir, positions, journal, ordres-poses, decisions-recentes, systeme]

# Blocs cachés (jugés superflus). « resume » et « capital » ne peuvent PAS être cachés (règle n°1 :
# capital, solde disponible et faillite toujours visibles) : le code les réaffiche.
masquer: []

# Blocs REPLIÉS au départ : seul leur titre et une ligne de résumé restent visibles ; un toucher sur
# le titre les ouvre (le navigateur d'Etienne retient son choix). Le cœur, le résumé et le capital
# ne se replient jamais.
replier: [ordres-poses, journal, decisions-recentes, systeme]

# « À la une » : au plus 5 points courts (280 caractères chacun), écrits par le chercheur, en tête
# du résumé : ce qu'il juge le plus important pour Etienne en ce moment. Des faits, avec leur source
# (arène, test sur le passé…), jamais une promesse de gain. Vide = pas d'encadré.
a_la_une:
  date: "2026-10-22"
  points:
    - "Capital principal : 787,5 € réalisés sur 1 000 de départ. Les pertes viennent d'avant la copie fidèle (nf_court −145 €, météo −58 €) ; depuis, le principal copie à environ un tiers de la mise des fantômes (enquête du 22/10)."
    - "La championne nf_sport_patiente n'a pas d'avantage de prix prouvé : sans ses 3 meilleurs paris elle fait +2 € ; 459 favoris de sport gagnés pour 461 attendus par les prix (experiments/enquetes/2026-10-22_championne_biais_et_mises.md)."
    - "Huit pistes écartées ou trompeuses le 22/10 (score exact, tranches, lissage, proposition UMA, NON des drames, touche/au-dessus, BO3 e-sport, résultats d'entreprises) : les marchés liquides sont déjà cohérents entre eux."
    - "Brésil, 2e tour le 25/10 : les tranches « marge de victoire » de Flávio dépassent son prix « vainqueur » de 2,6 points (relevé experiments/marge_coherente/) ; gain sans risque d'environ 0,65 %, trop petit pour l'arène."

# Fiche d'une stratégie (demande d'Etienne, 21/10/2026) : toucher une ligne de l'arène charge le
# journal PUBLIC de la stratégie depuis cette adresse (branche « data » du dépôt) et calcule ses
# courbes dans le navigateur, à ce moment-là. Seule une adresse raw.githubusercontent.com finissant
# par « / » est acceptée (sinon la page la déduit de son adresse GitHub Pages).
journaux_url: "https://raw.githubusercontent.com/r655rkz7bt-stack/Polymarket-autonomus-lab/data/ledger/fantome/"
