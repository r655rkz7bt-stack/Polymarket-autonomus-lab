#     expire: "2026-12-10"        # plus d'achat après cette date
#     mise_max: 0.05              # part du capital du fantôme au plus
#     raison: "…"                 # en une ou deux phrases
#     sources: ["https://…"]
#     ecrit_le: "2026-11-07"
#     abandon: false              # true : revendre (Claude a changé d'avis)
# Ne jamais modifier une conviction après coup pour la faire paraître juste : en ajouter une nouvelle (autre id) et
# abandonner l'ancienne. Le journal Git garde l'historique de chaque prévision.
