#     marche: "123456"            # id Gamma du marché (gamma-api.polymarket.com/markets/<id>)
#     question: "Will the Fed"    # début de la question : contrôle que l'id est le bon
#     issue: "No"                 # issue achetée, comme écrite dans le marché
#     probabilite: 0.82           # estimation de Claude
