# FICHIER PROTÉGÉ — règles de l'arène (décision d'Etienne, 15/10/2026).
# Le chercheur ne peut pas les assouplir pour promouvoir ses propres stratégies.
# Lues par scripts/run_simulation.py et scripts/research_brief.py (arena.py, brief.py).

min_closed_trades: 20            # pour devenir champion (et pour être jugé / éliminé)
promotion_margin: 0.0            # écart de croissance log nécessaire pour détrôner le champion
elimination_every_days: 7        # la pire stratégie éligible est éliminée une fois par semaine
min_days_before_elimination: 7
min_strategies_in_test: 3        # innovation obligatoire
radical_idea_after_days_without_record: 7
