# Règles de l'arène. Libres depuis le 15/10/2026 (décision d'Etienne) : le chercheur peut les
# changer ; chaque changement passe par une pull request, visible dans l'historique.
# Lues par scripts/run_simulation.py et scripts/research_brief.py (arena.py, brief.py).

# Seuil d'ENTRÉE (devenir champion ou recevoir une part du capital principal) : les trois à la fois.
# Durcis le 15/10/2026 : market_structure avait été promue sur +0,02 % après 27 opérations en
# 3 h (du bruit), puis destituée 10 minutes plus tard. Le chercheur peut tout changer ici.
min_closed_trades: 20            # opérations clôturées dans son fantôme (aussi : seuil pour être jugé/éliminé)
min_age_hours: 24                # ancienneté minimale du fantôme (une journée de marchés réels)
min_log_growth: 0.02             # croissance log du capital réalisé ≥ 0,02 (≈ +2 %)
# Seuils d'entrée ALLÉGÉS pour les stratégies validées sur le passé (16/10/2026) : un test hors
# échantillon documenté remplace une partie de l'attente. Clé = début du nom de la stratégie
# (toutes ses versions et variantes). Elle doit quand même gagner en direct (croissance > 0).
# Le chercheur ajoute une stratégie ici seulement avec un test documenté dans experiments/.
# ATTENTION (16/10/2026) : le test doit tenir AUX PRIX RÉELLEMENT PAYÉS (idea_test.taker_cost),
# pas seulement avec l'historique « 10 minutes » du CLOB : la météo y gagnait +28 %, mais −6 %
# aux prix réels (experiments/meteo_backtest.md) ; elle a donc été retirée d'ici.
# Exemple : `nom_de_strategie: {min_closed_trades: 8, min_age_hours: 8, min_log_growth: 0.005}`
validated_strategies: {}
# Priorité aux stratégies prouvées sur le passé (option B d'Etienne, 21/10/2026) : dès qu'une
# stratégie de `validated_strategies` est qualifiée en direct (seuils ci-dessus), les validées
# passent devant pour les places et les doublons, et se partagent le capital principal ; les autres
# qualifiées (la championne comprise) gardent ensemble `part_des_autres`. Sans validée qualifiée,
# rien ne change. Raison : avec 95 stratégies, la meilleure en direct est souvent la meilleure
# par chance (nf_sport_patiente, z 1,57 = ce qu'on attend du meilleur de 43 sans avantage).
# null = règle désactivée. Une fille d'une mère validée s'exclut avec `nom_de_la_fille: null`.
priorite_validees: {part_des_autres: 0.2}
# Preuves avant promotion (AMELIORATION n°1, 17/10/2026) : score de confiance des résultats par
# opération (moyenne / erreur type). meteo_prevision a été promu à t = 0,61 (du hasard) et a coûté
# au principal. Depuis le 18/10 au soir, il porte sur le RENDEMENT de chaque opération (résultat /
# mise) et non plus sur les euros : avec des mises inégales, les euros mesuraient la taille des
# mises (nf_sport 2,7 sans aucun avantage sur ses prix ; sur le rendement 0,4). Rejeu :
# experiments/promotion/rejouer.py (règle actuelle −15, rendement +74, journaux du 15 au 18/10).
min_t_stat: 1.5
# Période d'essai : la part engagée croît avec les opérations clôturées (25 % au départ, entière à 60).
essai: {pleine_part_apres_operations: 60, part_minimale: 0.25}
# Modes de jugement (AMELIORATION n°3 et 4), par préfixe de nom, avec une part plafonnée :
# - tenue de marché : payée surtout en récompenses, elle clôture peu d'opérations → jugée sur ses
#   journées de récompenses versables (+ capital au-dessus du départ, récompenses comprises) ;
# - favori politique (seule poche solide sur le passé, réglée en semaines) → jugé sur la valeur de
#   ses positions au prix du carnet, après 3 jours au moins.
juger_sur_recompenses:
  market_maker: {jours_min: 3, part_max: 0.3}
juger_sur_valeur:
  favori_politique: {min_age_hours: 72, part_max: 0.2}
  parking_politique: {min_age_hours: 72, part_max: 0.3}   # 19/10/2026 : marchés à récompense de détention
# Seuil de MAINTIEN (plus bas : pas de va-et-vient) : le champion reste tant qu'il fait mieux
# que « ne rien faire » au-delà de cette valeur ; en dessous, il est destitué.
keep_log_growth: 0.0
# … et tant que son score de confiance (rendement par mise) reste positif : un champion qui gagne de
# l'argent en pariant moins bien que ses prix (nf_court, −0,7 le 18/10) est destitué (18/10/2026).
keep_t_stat: 0.0
# Plusieurs championnes (décision d'Etienne, 18/10/2026) : plus de marge de +1 % ; toute stratégie
# qualifiée reçoit sa part. Le titre de « champion » du journal signé reste à la doyenne tant
# qu'elle est qualifiée (aucun va-et-vient).
promotion_margin: null
max_strategies_in_main: 5        # le capital principal se répartit entre les 5 meilleures au plus
# Répartition entre les qualifiées : moitié à égalité, moitié selon les gains (+15 % et +3 % →
# 67 % / 33 %), recalculée au plus une fois par heure (une entrée ou une sortie s'applique tout de
# suite).
repartition: {merite: 0.5, recalcul_minutes: 60}
# Doublons (décision d'Etienne, 18/10/2026, option B) : deux qualifiées dont plus de 50 % des paris
# (événements achetés, comptés sur la plus petite des deux) sont communs n'ont qu'une place, celle
# de la meilleure. En dessous, chacune a la sienne, même une mère et sa fille. Sans achat à
# comparer, une mère et ses filles restent présumées jumelles. null = une seule place par famille.
# Mesure du 18/10 : nf_sport a joué 79 % de ses matchs avec nf_court (doublon) ; nf_sport_patiente
# 17 % seulement.
chevauchement_max: 0.5
# Au plus 50 % du capital principal sur une seule stratégie, même seule qualifiée (le reste attend).
part_max_par_strategie: 0.5
elimination_every_days: 7        # la pire stratégie éligible est éliminée une fois par semaine
min_days_before_elimination: 7
min_strategies_in_test: 3        # innovation obligatoire
radical_idea_after_days_without_record: 7
# Ménage (17/10/2026, AMELIORATION n°9) : une stratégie sans aucune opération clôturée ni position
# après ce nombre de jours est retirée (comme une élimination, sans toucher au compteur hebdomadaire).
retirer_inactives_apres_jours: 3
jamais_retirer: [market_maker]
# Ménage (19/10/2026) : retrait immédiat d'une stratégie clairement pire que le hasard (score de
# confiance sur le rendement ≤ −1,5 après 20 opérations), sans attendre l'élimination hebdomadaire.
# Le 19/10 : news_momentum (−1,7), news_momentum_patiente (−1,6), meteo_prevision (−1,6).
retirer_perdantes: {min_operations: 20, confiance_max: -1.5}   # la tenue de marché peut rester longtemps sans exécution (récompenses)
# Moins de filles (AMELIORATION n°5 du 21/10/2026, arena.retire_daughters). Plus on teste de
# variantes, plus l'une gagne par chance, et plus le cycle ralentit (naive_favorite et
# nf_sport_patiente avaient 21 filles vivantes chacune). Une fille est retirée si elle est :
# - muette : ni opération ni position après `inactives_apres_jours` jours ;
# - un doublon : ≥ `doublon_chevauchement` de paris communs avec sa mère ou une sœur, et sur la
#   période commune (≥ `doublon_min_operations` opérations chacune) pas meilleure par opération ;
# - en trop : au-delà de `max_par_mere` filles vivantes, les plus faibles d'au moins `age_min_jours`
#   jours dont la croissance est sous `garder_croissance`.
# Jamais le champion, une qualifiée, un mode de jugement ni `jamais_retirer`. Essai à blanc sur les
# journaux du 21/10 au matin : 13 retraits sur 110 stratégies vivantes (12 en trop, 1 doublon).
# Le chercheur ne crée pas de nouvelle fille d'une mère qui en a déjà `max_par_mere`.
filles:
  max_par_mere: 10
  age_min_jours: 2
  garder_croissance: 0.02
  inactives_apres_jours: 2
  doublon_chevauchement: 0.9
  doublon_min_operations: 20

