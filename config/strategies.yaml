# Laboratoire dédié à UNE stratégie : nf_sport_patiente_prix_850_875, exportée le 28/10/2026 du laboratoire
# « Polymarket Autonomous Lab » (r655rkz7bt-stack/Polymarket-autonomus-lab), où elle était n° 1 de l'arène
# (au 28/10/2026 23 h 48 UTC : 1 484 € fictifs en 8,3 jours, 85 opérations, confiance 90 %, verdict « indéterminée » ;
# la veille 1 566 €, 74 opérations, 98 %, « prometteuse »). Contexte complet : docs/CONTEXTE.md.
#
# ARÈNE : chaque stratégie activée trade dans son propre portefeuille fantôme (1 000 virtuels, vrais carnets).
# Le capital principal suit le champion choisi par src/polymarket_agent/arena.py (règles : config/promotion.yaml).
# Pour tester une idée : ajouter une variante ci-dessous (même `class`, autre nom, autres réglages ou `filtres`) ;
# elle aura son propre fantôme et sa propre confiance, à comparer à l'originale sur la même période.

nf_sport_patiente_prix_850_875:
  explication: "Le favori d'un match (sport ou e-sport), acheté en posant l'ordre 1 cran au-dessus du meilleur acheteur et en attendant un vendeur, seulement quand le prix payé est entre 0,85 et 0,875."
  # Origine : favori naïf (« le favori gagne un peu plus souvent que son prix ») → sport → mode patient → morceau de prix
  # 0,850-0,875 (entonnoir 80/20 du 20/10/2026). Attention : c'était la meilleure de plusieurs dizaines de stratégies de
  # favoris ; une part de son avance peut venir de la chance. Ce laboratoire sert justement à la mettre à l'épreuve.
  class: naive_favorite
  limit_ticks: 1
  filtres: {familles: [sports], prix_min: 0.85, prix_max: 0.875}
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-20"
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.01, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}

nf_sport_patiente_prix_850_875_avant_match:
  explication: "La n° 1 de l'arène (favori de sport payé 0,85-0,875, achat posé), mais son ordre posé tombe au coup d'envoi : jamais servi pendant que le match se joue."
  # Sœur de `nf_sport_patiente_prix_850_875` (28/10/2026, enquête « posées en match » du labo d'origine, résumée dans docs/CONTEXTE.md), pas une fille (la mère en a déjà 10) : mêmes paramètres, même filtre, seule
  # différence : `annuler_au_coup_d_envoi`. Les ordres posés servis en match perdent 9,8 % par pari (320 jetons, z −2,8, −8,2 % avant le 25/10, −12,7 % depuis) contre −0,3 % pour un achat immédiat ;
  # chez la n° 1, 35 paris posés en match : −2,9 % (−132 €), les 45 autres +8,1 % (+459 €). Cette sœur dit si son gain tient sans la part exposée à la sélection adverse. À juger sur la MÊME période.
  morceau: "prix payé 0,850-0,875, ordres annulés au coup d'envoi"
  class: naive_favorite
  limit_ticks: 1
  annuler_au_coup_d_envoi: true
  filtres: {familles: [sports], prix_min: 0.85, prix_max: 0.875, heures_min: 0}  # heures_min 0 : plus aucun NOUVEL ordre une fois le match commencé
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-28"
  hypothesis: >
    Le gain de la n° 1 vient des paris posés avant le match ; sans les paris posés servis en match (sélection adverse, −9,8 % sur 320 jetons) la sœur fait au moins aussi bien. Une perte
    apprendrait que le gain de la n° 1 dépendait de paris en match qui gagnent autant que leurs prix (35 paris : 30,5 gagnés pour 29,8 attendus) ou que le mode patient avant le match ne suffit pas.
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.01, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}
