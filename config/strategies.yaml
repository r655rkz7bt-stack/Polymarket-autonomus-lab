# Labo v2 (07/11/2026, demande d'Etienne : « tout reset, beaucoup plus de liberté pour Claude et le chercheur »).
# Bilan de la v1 et raisons : experiments/BILAN_V1.md. Toutes les stratégies repartent de 1 000 € dans ledger/fantome_v2
# (version 2.0.0) ; l'ancienne configuration complète (190 stratégies) reste dans l'historique Git (avant le 07/11/2026).
#
# Gardées : les seules qui avaient un indice MESURÉ (en direct et/ou sur le passé). Nouveau : `convictions_claude`, les
# prévisions que Claude écrit lui-même après recherche (config/convictions.yaml). Le chercheur ajoute librement de nouvelles
# stratégies (une idée neuve par passage, jamais une variante sans raison nouvelle).

convictions_claude:
  explication: "Claude étudie à fond quelques marchés (règles, source de résolution, données, actualité), écrit sa propre probabilité, et on achète quand le marché est nettement en dessous."
  class: convictions_claude
  table: convictions.yaml
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-07"
  hypothesis: >
    Avantage d'INFORMATION et de lecture des règles, pas un biais de prix : sur des marchés lents (politique, économie, science,
    culture, règlements particuliers), une recherche approfondie et écrite à l'avance bat le prix quand Claude lit une source que
    la foule ne lit pas, ou des règles de résolution mal comprises. Une perte apprendrait que les prévisions de Claude ne battent
    pas la foule : on regarde gagnés contre attendus (borne basse) par conviction et par thème.
  params:
    min_net_edge:   {value: 0.03, min: 0.0, max: 0.5}
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 5, min: 0, max: 50}

compteur_tweets:
  explication: "Combien de messages Elon Musk (ou Trump, la Maison-Blanche...) publiera-t-il cette semaine ? On compte ceux déjà publiés et son rythme, et on achète la tranche (ou son NON) la moins chère par rapport au calcul."
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-20"
  params:
    # Réglages choisis sur le passé (7 comptes, juillet-octobre 2026) : experiments/vingt_pistes.md
    dispersion:     {value: 12, min: 0.5, max: 1000}     # petite = rafales fréquentes (loi binomiale négative)
    min_price:      {value: 0.10, min: 0.0, max: 0.5}    # passé : billets < 0,10 perdants
    recent_hours:   {value: 168, min: 6, max: 336}
    long_hours:     {value: 336, min: 24, max: 336}      # relevé : 14 jours heure par heure
    recent_weight:  {value: 0.5, min: 0.0, max: 1.0}
    desaccord_max:  {value: 1.6, min: 0.0, max: 10.0}   # 08/11 : s abstenir si le mélange dépasse 1,6 x la médiane des rythmes (experiments/regime_rafale.md)
    max_stale_hours: {value: 1, min: 0.25, max: 12}      # relevé toutes les 15 minutes
    margin:         {value: 0.03, min: 0.0, max: 0.3}
    uncertainty:    {value: 0.01, min: 0.0, max: 0.1}
    min_net_edge:   {value: 0.01, min: 0.0, max: 0.3}
    max_extra_ticks: {value: 1, min: 0, max: 5}
    max_proposals_per_cycle: {value: 2, min: 0, max: 20}
    kelly_fraction: {value: 0.25, min: 0.0, max: 2.0}

compteur_tweets_72_168h:
