# ---------------------------------------------------------------- heure de la journée (17/10/2026, AMELIORATION n°7)
# experiments/favori/heure.py (303 229 échanges réels) : pas d'effet général de l'heure ni du week-end ;
# deux poches faibles : favori politique 4-12 h UTC (+1,5 à +2 %), outsider sportif 12-24 h UTC (+8 à +10 %).

favori_politique_nuit:
  explication: "Comme favori_politique, mais seulement la nuit et le matin (4 h-12 h UTC), quand l'Amérique dort et que les prix bougent moins bien."
  mere: favori_politique
  morceau: "4 h-12 h UTC"
  class: naive_favorite
  familles: [politics, sans_frais]
  filtres: {heure_utc: [4, 12]}
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-17"
  params:
    min_ask:        {value: 0.85, min: 0.50, max: 0.99}  # 0,80-0,85 : écart faible (+1,5 pt)
    max_ask:        {value: 0.97, min: 0.60, max: 0.99}
    bias:           {value: 0.0, min: 0.00, max: 0.06}   # remplacé par shrink
    shrink:         {value: 0.5, min: 0.0, max: 0.9}     # sous l'écart mesuré (0,70 ; 0,82 à 0,95-0,98)
    uncertainty:    {value: 0.01, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.01, min: 0.00, max: 0.50}
    min_hours:      {value: 6, min: 0, max: 720}         # pas les dernières heures
    max_hours:      {value: 720, min: 1, max: 2000}
    max_candidates:  {value: 40, min: 0, max: 200}   # marchés politiques demandés au scanner
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction: {value: 0.5, min: 0.0, max: 5.0}

outsider_sport_apres_midi:
  explication: "Comme outsider_sport_patiente, mais seulement l'après-midi et le soir (12 h-24 h UTC), où l'outsider gagnait plus souvent que son prix."
  mere: outsider_sport_patiente
  morceau: "12 h-24 h UTC"
  class: naive_favorite
  familles: [sports]
  filtres: {heure_utc: [12, 24]}
  limit_ticks: 1
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-17"
  params:
    underdog:       {value: 1, min: 0, max: 1}
    min_ask:        {value: 0.08, min: 0.01, max: 0.5}
    max_ask:        {value: 0.20, min: 0.02, max: 0.5}
    bias:           {value: 0.03, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.0, min: 0.00, max: 0.50}
    min_hours:      {value: 0.5, min: 0, max: 720}
    max_hours:      {value: 24, min: 1, max: 2000}
    max_candidates:  {value: 30, min: 0, max: 200}   # matchs demandés au scanner
    max_extra_ticks: {value: 0, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction: {value: 1.0, min: 0.0, max: 5.0}

fin_de_match:
  explication: "Quand la ligue a annoncé le score final mais que Polymarket n'a pas encore payé, on achète le gagnant juste sous 1."
  # AMELIORATION n°2 (17/10/2026) : score FINAL officiel (mlb.com, nhl.com, football-data.org) →
  # gagnant connu ; tant que le marché n'est pas réglé, son jeton se vend parfois sous 0,99.
  # Rattachement prudent marché ↔ match (sports_link.py). Test sur le passé : experiments/fin_de_match/.
  # COUPÉE avant même de jouer (17/10/2026) : sur 175 matchs MLB (17/09-16/10), le gagnant ne se
  # vend plus sous 0,999 au-delà de 1 à 2 minutes après la fin, jamais après 5 min ; notre cycle
  # (5 min) arrive toujours trop tard. Gardée pour le football ou le hockey si un test les montre plus lents.
  enabled: false
  version: "1.0.0"
  created_at: "2026-10-17"
  params:
    certainty:      {value: 0.995, min: 0.90, max: 0.999}  # risque restant : équipe mal reliée, litige
    max_price:      {value: 0.99, min: 0.50, max: 0.999}
    min_net_edge:   {value: 0.004, min: 0.0, max: 0.10}
    stake_fraction: {value: 0.10, min: 0.0, max: 0.5}      # 10 % du capital par match terminé
    window_hours:   {value: 8, min: 1, max: 48}            # matchs commencés depuis 1 à 8 h
    max_candidates: {value: 40, min: 0, max: 200}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 5, min: 0, max: 50}

cotes_bookmakers:
  explication: "Avant un match, on compare le prix de Polymarket à l'avis des bookmakers ; si Polymarket est nettement moins cher, on achète."
  # AMELIORATION n°5 (17/10/2026) : probabilité moyenne des bookmakers (The Odds API, marge retirée)
  # contre le prix du carnet ; relevé toutes les 12 h (offre gratuite, 500 crédits par mois).
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-17"
  params:
    margin:             {value: 0.02, min: 0.0, max: 0.20}   # retirée de la probabilité des bookmakers
    min_net_edge:       {value: 0.03, min: 0.0, max: 0.30}
    max_odds_age_hours: {value: 13, min: 1, max: 48}
    horizon_hours:      {value: 36, min: 1, max: 96}
    max_candidates:     {value: 40, min: 0, max: 200}
    kelly_fraction:     {value: 0.25, min: 0.0, max: 5.0}
    max_extra_ticks:    {value: 1, min: 0, max: 5}
    max_proposals_per_cycle: {value: 4, min: 0, max: 50}
