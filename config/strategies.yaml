favori_politique_quasi_certain:
  explication: "En politique, on achète ce qui est presque sûr (97 %) pour gagner un tout petit peu, mais souvent."
  # Favori n°1 bis : politique et géopolitique 0,97-0,995 (« presque acquis », souvent un résultat
  # connu en attente de règlement) : 99,6 % gagnés pour 98,8 % de prix (+0,8 % après frais) ;
  # 0,95-0,98 : +2,8 %. Petit gain par pari, mais argent rendu vite. Une seule perte coûte cher.
  class: naive_favorite
  familles: [politics, sans_frais]
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-16"
  params:
    min_ask:        {value: 0.97, min: 0.50, max: 0.999}
    max_ask:        {value: 0.995, min: 0.60, max: 0.999}
    bias:           {value: 0.0, min: 0.00, max: 0.06}
    shrink:         {value: 0.5, min: 0.0, max: 0.9}
    uncertainty:    {value: 0.003, min: 0.001, max: 0.10}
    min_net_edge:   {value: 0.002, min: 0.00, max: 0.50}
    min_hours:      {value: 1, min: 0, max: 720}
    max_hours:      {value: 720, min: 1, max: 2000}
    max_candidates: {value: 40, min: 0, max: 200}
    max_extra_ticks: {value: 1, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction: {value: 0.5, min: 0.0, max: 5.0}

seismes_marche:
  explication: "Un site officiel américain liste chaque séisme du monde ; on voit déjà le plus fort de la journée (ou combien il y en a eu cette semaine) et on achète la tranche que le marché vend trop peu cher, ou on parie contre celle qu'il vend trop cher."
  class: seismes_marche
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-24"
  hypothesis: >
    Test sur le passé (experiments/seismes.md, 24/10/2026), verdict INDICE : 27 marchés « plus gros séisme du jour » (25/09 → 22/10) et
    55 marchés « combien de séismes cette semaine » (décembre → octobre) réglés sur l'USGS, règlement relu 26/27 (jour) et 47/57 (semaine ;
    les 10 écarts sont tous des marchés >= 5,5 où le marché a compté un séisme de plus que le catalogue d'aujourd'hui). Le modèle ne bat pas clairement le marché
    (test apparié par événement : jour meilleur 31 fois sur 56, t −1,3 ; semaine ≥ 5,5 t +1,2 en sa défaveur) ; aux prix payés (premier achat dans les 2 h) : jour 27 paris +69 % (13 jours,
    t 1,15), semaine >= 5,5 +24 % après frais (181 paris, 27 événements, t 2,05), semaine >= 6,5 +7 % (t 0,6). ~30 découpages regardés,
    marchés minces (médiane 8 $ par échange) : le gain n'est PAS prouvé. Quart de Kelly.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance calculée − prix demandé − frais
    uncertainty:    {value: 0.0, min: 0.0, max: 0.30}
    min_price:      {value: 0.04, min: 0.01, max: 0.50}
    max_price:      {value: 0.96, min: 0.50, max: 0.99}
    max_stale_hours: {value: 0.25, min: 0.1, max: 24}   # catalogue relevé toutes les 10 min ; un séisme récent absent fausse la loi
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 60, min: 0, max: 200}
    max_proposals_per_cycle: {value: 4, min: 0, max: 20}
    max_per_event:  {value: 2, min: 1, max: 10}           # les tranches d'un même événement gagnent ou perdent ensemble
    max_ecart_doublon: {value: 0.15, min: 0.0, max: 1.0}  # 24/10/2026 : pas d'achat si le compte sans doublon entre réseaux USGS change la chance de plus de 0,15
    kelly_fraction: {value: 0.25, min: 0.0, max: 2.0}     # quart de Kelly : indice sur peu de jours, marchés minces

lid_agenda:
  explication: "Chaque jour, un marché demande si la Maison-Blanche annoncera la fin de journée du Président (le « lid ») avant 18 h 30. On lit son agenda publié la veille : journée calme sans voyage, le lid tombe tôt presque toujours ; journée de voyage qui finit tard, presque jamais. On parie quand le marché ne l'a pas vu."
  class: lid_agenda
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-10"
  hypothesis: >
    Expérience audacieuse, lire la source de résolution (experiments/lid_agenda.md, 10/11/2026). 210 marchés réglés (février → novembre 2026) ;
    règlement = premier « Travel/Photo lid called » de Roll Call Factbase (199/210). Agenda (607 jours) : sans voyage et dernier rendez-vous avant
    17 h → 86 % (84 % puis 89 %) ; voyage et dernier rendez-vous ≥ 17 h → 14 % (14 % puis 14 %) ; le marché cotait ces cases 0,73 et 0,22 à 12 h.
    MAIS l'agenda archivé est l'agenda final (regard vers le futur possible) et les prix horaires sont rarement des prix exécutés (19 vrais
    achats au mieux) : indice, pas preuve. Une perte apprendrait que l'agenda de la veille ne vaut pas l'agenda final, ou que les carnets
    n'offrent pas ces prix.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance − prix demandé − frais
    uncertainty:    {value: 0.04, min: 0.0, max: 0.30}    # borne basse = chance − 0,04
    min_price:      {value: 0.05, min: 0.01, max: 0.50}
    max_price:      {value: 0.92, min: 0.50, max: 0.99}
    max_stale_hours: {value: 1, min: 0.1, max: 24}
    min_hours:      {value: 0.5, min: 0.0, max: 24}       # avant l'heure limite
    max_hours:      {value: 30, min: 1, max: 96}          # l'agenda du jour sort la veille au soir
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 10, min: 0, max: 50}
    max_proposals_per_cycle: {value: 2, min: 0, max: 10}
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}      # demi-Kelly sur la borne basse : expérience franche, un pari par jour

non_aux_drames:
  explication: "Les gens paient trop cher le frisson d'une catastrophe lointaine (une invasion, un président renversé) : on parie qu'elle n'arrivera pas, avec une petite mise."
  class: non_aux_drames
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-23"
  hypothesis: >
    Piste n° 11 revue (experiments/pistes_crypto_elections_drames.md) : NON des « drames » (liste de mots
    fixée avant les résultats) à OUI 2-15 %, 30 à 120 jours avant l'échéance : 149 paris 2024-2026, +4,6 %
    par pari aux prix payés, 2 drames pour 9,3 attendus, t par événement 2,81 ; témoin non-drames +0,9 %.
    Le chercheur l'avait écartée sur TOUS les marchés longs (+1,7 à +2,8 %, experiments/non_aux_drames.md) :
    l'effet est sur les drames. 2 % du capital par événement ; arrêter si deux drames arrivent le même mois.
  params:
    min_days:       {value: 30, min: 7, max: 365}
    max_days:       {value: 120, min: 14, max: 900}
    yes_min:        {value: 0.02, min: 0.005, max: 0.30}
    yes_max:        {value: 0.15, min: 0.01, max: 0.40}
    min_volume:     {value: 5000, min: 0, max: 10000000}
    yes_factor:     {value: 0.5, min: 0.0, max: 1.0}   # chance réelle ≈ moitié du prix (2 pour 9,3 sur le passé : prudent)
    uncertainty:    {value: 0.01, min: 0.0, max: 0.1}
    stake_fraction: {value: 0.02, min: 0.0, max: 0.10}
    min_net_edge:   {value: 0.005, min: 0.0, max: 0.2}
    max_candidates: {value: 40, min: 0, max: 200}
    max_extra_ticks: {value: 1, min: 0, max: 5}
    max_proposals_per_cycle: {value: 2, min: 0, max: 20}

suivre_inities:
  explication: "Quand les journaux ou les réseaux parlent de paris suspects sur un prix ou un classement, et que des comptes tout neufs misent gros sur le même résultat, on parie avec eux."
  # Demande d'Etienne (27/10/2026, affaire du Ballon d'Or : 12 comptes créés en octobre, 264 000 $ sur le classement exact, article
  # d'Upside le 23/10, résultat le 26/10). Sources : polymarket_agent/inities.py (échanges publics, profils des comptes, commentaires
  # Polymarket, Mastodon, Hacker News, Google Actualités). Test sur le passé : experiments/inities.md.
  class: suivre_inities
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-27"
  hypothesis: >
    Expérience. Sur 740 événements « à initiés » (prix, classements, émissions, nominations) de septembre 2025 à octobre 2026,
    1,7 million de vrais échanges et 10 115 comptes profilés, suivre l'argent NEUF et CONCENTRÉ seul ne bat pas ses prix
    (48 réglages essayés, aucun robuste ; le meilleur, « indice », est ce que le hasard donne au meilleur de 48) : ces comptes
    sont surtout de nouveaux joueurs qui misent sur des outsiders (Fed : 5 paris perdus à 0,01-0,09). Les vrais cas d'initiés
    sont visibles (Ballon d'Or 2026 : 5 sur 6 ; Nobel 2025 : Machado à 0,54) mais noyés. D'où le filtre de la demande :
    jouer seulement quand la presse, les réseaux ou les commentaires parlent de paris suspects sur l'événement AVANT le résultat, et sur le
    jeton où l'argent neuf se concentre, à 0,30 ou plus (pas les billets). Trop rare sur le passé pour un test (sur 428 articles
    en 14 mois, presque tous après le résultat). Une perte apprendrait que même les soupçons publics sont déjà dans le prix.
  params:
    presse_requise: {value: 1, min: 0, max: 1}
    min_comptes:    {value: 1, min: 1, max: 20}
    min_dollars:    {value: 2000, min: 0, max: 1000000}
    prix_min:       {value: 0.30, min: 0.0, max: 0.95}        # prix moyen des comptes suspects : pas les billets d'outsiders
    max_age_hours:  {value: 72, min: 1, max: 720}
    max_price:      {value: 0.90, min: 0.05, max: 0.99}
    max_rattrapage: {value: 0.15, min: 0.0, max: 0.5}          # au plus 15 centimes au-dessus du prix moyen des comptes suspects
    edge_prior:     {value: 0.10, min: 0.0, max: 0.5}
    uncertainty:    {value: 0.03, min: 0.0, max: 0.2}
    stake_fraction: {value: 0.03, min: 0.0, max: 0.2}          # 3 % du fantôme par pari : mise franche, perte bornée
    min_net_edge:   {value: 0.0, min: 0.0, max: 0.5}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 20}
