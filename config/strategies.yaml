seismes_marche:
  explication: "Un site officiel américain liste chaque séisme du monde ; on voit déjà le plus fort de la journée (ou combien il y en a eu cette semaine) et on achète la tranche que le marché vend trop peu cher, ou on parie contre celle qu'il vend trop cher."
  class: seismes_marche
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-24"
  hypothesis: >
    Test sur le passé (experiments/seismes.md, 24/10/2026), verdict INDICE : 27 marchés « plus gros séisme du jour » (25/09 → 22/10) et
    55 marchés « combien de séismes cette semaine » (décembre → octobre) réglés sur l'USGS, règlement relu 26/27 (jour) et 47/57 (semaine ;
    les 10 écarts sont tous des marchés >= 5,5 où le marché a compté un séisme de plus que le catalogue d'aujourd'hui). Le modèle ne bat pas clairement le marché
    (test apparié par événement : jour meilleur 31 fois sur 56, t −1,3 ; semaine ≥ 5,5 t +1,2 en sa défaveur) ; aux prix payés (premier achat dans les 2 h) : jour 27 paris +69 % (13 jours,
    t 1,15), semaine >= 5,5 +24 % après frais (181 paris, 27 événements, t 2,05), semaine >= 6,5 +7 % (t 0,6). ~30 découpages regardés,
    marchés minces (médiane 8 $ par échange) : le gain n'est PAS prouvé. Quart de Kelly.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance calculée − prix demandé − frais
    uncertainty:    {value: 0.0, min: 0.0, max: 0.30}
    min_price:      {value: 0.04, min: 0.01, max: 0.50}
    max_price:      {value: 0.96, min: 0.50, max: 0.99}
    max_stale_hours: {value: 0.25, min: 0.1, max: 24}   # catalogue relevé toutes les 10 min ; un séisme récent absent fausse la loi
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 60, min: 0, max: 200}
    max_proposals_per_cycle: {value: 4, min: 0, max: 20}
    max_per_event:  {value: 2, min: 1, max: 10}           # les tranches d'un même événement gagnent ou perdent ensemble
    max_ecart_doublon: {value: 0.15, min: 0.0, max: 1.0}  # 24/10/2026 : pas d'achat si le compte sans doublon entre réseaux USGS change la chance de plus de 0,15
    max_spread:     {value: 0.15, min: 0.0, max: 1.0}     # 11/11/2026 : ancien filtre du scanner (étiquette 103038 élargie pour seismes_pays)
    max_ecart_rapide: {value: 0.03, min: 0.0, max: 1.0}   # 11/11/2026 : pas d'achat si un séisme vu par l'EMSC et absent de l'USGS change la chance de plus de 0,03 (enquetes/2026-11-11_matin_seismes_catalogue_en_retard.md)
    kelly_fraction: {value: 0.25, min: 0.0, max: 2.0}     # quart de Kelly : indice sur peu de jours, marchés minces

seismes_pays:
  explication: "Chaque mois, Polymarket demande si un gros séisme (6 ou plus) frappera le Japon, le Pérou, le Mexique… On sait, grâce au catalogue officiel américain, combien de jours par an chaque pays en a un ; le marché, peu suivi, cote souvent ces séismes 2 fois trop probables. On parie que le séisme n'arrivera pas (ou qu'il arrivera, quand c'est le marché qui le sous-estime)."
  class: seismes_pays
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-11"
  hypothesis: >
    Expérience audacieuse, fréquence de base de la source de résolution (experiments/seismes_pays.md, 11/11/2026). Marchés « Where will a 6.0+
    magnitude earthquake occur by end of <mois> ? » (7 pays, réglés sur la description de lieu de l'USGS ; Alaska = États-Unis). Septembre et octobre
    2026 aux vrais échanges, avant tout séisme qualifiant : premier achat par marché sous la base − 0,05 → 10 NON gagnés sur 11 pour 7,96 attendus
    (prix payés 5,66), +77 % par mise ; seuils 0 / 0,05 / 0,10 essayés (+67 % / +77 % / +86 %). MAIS 2 mois seulement, ~20 parts par échange,
    carnets très minces (vendeurs du NON à 0,63-0,93 aujourd'hui). Une perte apprendrait que la fréquence 2000-2025 sous-estime l'activité récente
    (séquences de répliques, années actives) ou que les prix bas n'étaient que des échanges isolés.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance (borne basse) − prix demandé − frais
    uncertainty:    {value: 0.03, min: 0.0, max: 0.30}    # rythme estimé sur 26 ans : ± quelques points
    min_price:      {value: 0.05, min: 0.01, max: 0.50}
    max_price:      {value: 0.93, min: 0.50, max: 0.99}
    max_stale_hours: {value: 0.25, min: 0.1, max: 24}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 20, min: 0, max: 200}
    max_proposals_per_cycle: {value: 4, min: 0, max: 20}
    max_per_event:  {value: 7, min: 1, max: 10}           # pays d'un même mois : séismes presque indépendants
    max_ecart_doublon: {value: 0.15, min: 0.0, max: 1.0}
    max_ecart_rapide: {value: 0.03, min: 0.0, max: 1.0}   # séisme >= 5,8 vu par l'EMSC, pas encore décrit par l'USGS : pays inconnu, pas d'achat
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}      # demi-Kelly sur la borne basse : expérience franche

secheresse_d4:
  explication: "Chaque semaine, Polymarket demande si chaque État américain aura une « sécheresse exceptionnelle » sur la carte officielle du jeudi. La sécheresse change très lentement : en regardant la carte de la semaine d'avant, déjà publiée, on sait presque toujours la réponse. Quand quelqu'un vend la réponse presque sûre à un prix bas, on l'achète."
  class: secheresse_d4
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-11"
  hypothesis: >
    Expérience audacieuse, lire la source de règlement avant la foule (experiments/secheresse.md, 11/11/2026, piste n° 24). Marchés « Exceptional
    drought (D4) by state — week of <mardi> » réglés sur la carte US Drought Monitor (D4 >= 0,05 % de l'État), publiée le jeudi ; la carte de la
    semaine d'avant est publique avant chaque échange. Loi de transition 2000-2025 (48 États, 67 000 cartes). 12 semaines (août-novembre 2026),
    règlement 433/433, vrais échanges avant publication, un achat par marché : seuil 0,05 → 84 paris, 79 gagnés pour 80,4 attendus (loi) et 49,6
    (prix payés) ; hors billets < 0,10 : 83 paris, +113 % par mise, z des prix +7,0 ; 16 réglages (seuil 0,02-0,20, prix, taille) tous « retenue ».
    MAIS aucun échange avant publication depuis le 20/10 (carnets 0,01/0,99, 3 mois seulement) : la stratégie peut rester muette. Une perte
    apprendrait que la carte bouge plus vite en automne qu'en moyenne 2000-2025 (pluies d'automne), ou que les vendeurs bon marché savaient
    quelque chose (brouillon de la carte, auteurs du Drought Monitor).
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance (borne basse) − prix demandé − frais
    uncertainty:    {value: 0.02, min: 0.0, max: 0.30}    # loi calibrée sur 12 semaines (79 gagnés pour 80,4 attendus)
    min_price:      {value: 0.10, min: 0.01, max: 0.50}   # jamais de billets sous 0,10
    max_price:      {value: 0.95, min: 0.50, max: 0.99}
    max_stale_hours: {value: 2, min: 0.1, max: 24}        # source relue toutes les heures
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 60, min: 0, max: 200}
    max_proposals_per_cycle: {value: 6, min: 0, max: 20}
    max_per_event:  {value: 10, min: 1, max: 40}          # États d'une même semaine : liés par la météo, d'où un plafond
    kelly_fraction: {value: 1.0, min: 0.0, max: 2.0}      # Kelly entier sur la borne basse : avantage mesuré, expérience franche

fleuves_prevision:
  explication: "Polymarket demande quand le Rhin (à Kaub) et le Danube (à Budapest) retrouveront un niveau normal, par tranches de dates. Les services officiels allemand et hongrois publient chaque jour une prévision du niveau pour les jours suivants ; on calcule la chance de chaque tranche à partir de cette prévision et on achète quand le marché est loin."
  class: fleuves_prevision
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-11"
  hypothesis: >
    Expérience audacieuse, avantage d'INFORMATION (experiments/niveaux_eau.md, 11/11/2026, piste n° 25) : la prévision officielle du
    niveau (WSV/BfG par PegelOnline pour Kaub, OVF hongrois pour Budapest) n'est pas lue par le marché. Le 11/11 : Rhin « avant le
    15/11 » à 0,66 pour une prévision culminant à 69 cm (seuil 77, chance calculée 0,39) ; Danube « avant le 15/11 » à 0,26 pour une
    prévision de 124 ± 17 cm le 15/11 à 7 h (seuil 93, chance 0,76). Aucun test sur le passé possible (prévisions non archivées, 3
    événements réglés) : le journal `fleuves:histo` garde chaque prévision pour le test à venir. Une perte apprendrait que les
    prévisions à 3-4 jours se trompent plus que leur marge (retard de la vague, pluie annoncée qui ne tombe pas), ou que le marché
    lit des prévisions plus récentes que les nôtres.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance (borne basse) − prix demandé − frais
    uncertainty:    {value: 0.10, min: 0.0, max: 0.30}    # modèle d'erreur non étalonné : borne basse = chance − 0,10
    min_price:      {value: 0.10, min: 0.01, max: 0.50}
    max_price:      {value: 0.90, min: 0.50, max: 0.99}
    max_stale_hours: {value: 3, min: 0.1, max: 24}        # source relue toutes les heures
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 30, min: 0, max: 200}
    max_proposals_per_cycle: {value: 4, min: 0, max: 20}
    max_per_event:  {value: 1, min: 1, max: 10}           # tranches d'un même fleuve : un seul tirage
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}      # demi-Kelly sur la borne basse : erreur de prévision non mesurée

auditeurs_spotify:
  explication: "Polymarket demande quel artiste aura le plus (ou le deuxième plus) d'auditeurs par mois sur Spotify le dernier jour du mois. Spotify affiche ce nombre chaque jour ; quand deux artistes sont presque à égalité, le marché croit souvent que celui qui mène aujourd'hui gagnera. On calcule la chance de chacun avec le nombre du jour et sa tendance, et on achète quand le marché est trop sûr."
  class: auditeurs_spotify
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-11"
  hypothesis: >
    Expérience audacieuse, avantage d'INFORMATION et de BASE (experiments/spotify_auditeurs.md, 11/11/2026, piste n° 28) : le
    nombre d'auditeurs mensuels est public chaque jour (profil Spotify, kworb.net) ; les places 2-3 sont serrées (The Weeknd
    116 993 416 contre Rihanna 116 778 078 le 11/11, écart 0,18 %, Rihanna qui gagne 26 000 par jour) et le marché paie le meneur
    du jour 0,81. Sur 5 mois réglés de « #2 Spotify Artist », le favori à 19 jours de la fin n'a gagné qu'une fois (octobre :
    The Weeknd 0,70-0,80, battu par Rihanna). Aucun test sur le passé possible (pas d'historique gratuit des auditeurs) : le
    journal `spotify:histo` étalonne la volatilité `vol` (0,003 par racine de jour, choisie à l'œil). Une perte apprendrait que
    le meneur du jour garde sa place plus souvent que notre bruit le dit (dérive persistante, sorties d'album connues du marché).
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance (borne basse) − prix demandé − frais
    uncertainty:    {value: 0.10, min: 0.0, max: 0.30}    # volatilité non étalonnée : borne basse = chance − 0,10
    min_price:      {value: 0.10, min: 0.01, max: 0.50}
    max_price:      {value: 0.90, min: 0.50, max: 0.99}
    max_stale_hours: {value: 6, min: 0.1, max: 30}         # source relue toutes les 3 h
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 30, min: 0, max: 200}
    max_proposals_per_cycle: {value: 2, min: 0, max: 20}
    max_per_event:  {value: 1, min: 1, max: 10}           # artistes d'une même place : un seul tirage
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}      # demi-Kelly sur la borne basse

rougeole_compteur:
  explication: "Polymarket demande si le compteur officiel de la rougeole aux États-Unis (page du CDC) dépassera un nombre de cas à une date donnée. Le CDC publie ce compteur chaque semaine et il ne reste que quelques mises à jour avant la date : on calcule la chance de chaque seuil avec le compteur du jour et la hausse habituelle par semaine (et le risque qu'une mise à jour saute un jour férié), et on achète quand le marché s'en écarte nettement."
  class: rougeole_compteur
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-12"
  hypothesis: >
    Expérience audacieuse, avantage d'INFORMATION (experiments/rougeole_compteur.md, 12/11/2026, piste n° 8, compteurs officiels
    à lecture directe) : le compteur qui règle est public chaque semaine (5 182 au 05/11) ; il reste 3 mises à jour avant le 30/11,
    chacune ajoute 165 à 330 cas (septembre-novembre 2026), et celle du 26/11 tombe à Thanksgiving (en 2025 le CDC a publié quand même : `q_ferie` 0,9). Le 12/11 « 6 000+ au 30/11 »
    cotait 0,15/0,57 (carnets minces, ~400-2 500 $ par seuil). Aucun test sur le passé possible (compteur hebdomadaire non archivé :
    seulement les échelles mensuelles réglées et la courbe par date d'éruption, gardée à chaque passage). Une perte apprendrait que le
