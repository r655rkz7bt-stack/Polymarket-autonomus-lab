# Décision d'Etienne : découper chaque stratégie qui gagne en morceaux (« filles ») pour voir quel
# morceau fait vraiment gagner. Chaque fille = la mère, mêmes réglages, sur UN morceau des marchés
# (`filtres`, voir strategy_engine.Filtered). Le tableau de bord (bloc « Entonnoir ») compare
# chaque fille à sa mère. Étape suivante : combiner les morceaux gagnants (familles + prix + délai).
# Dissection des paris déjà faits : experiments/dissection/dissequer.py.

nf_sport:
