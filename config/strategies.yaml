# Paramètres des stratégies. Liberté totale (décision d'Etienne, 15/10/2026) : les bornes
# [min, max] ne sont que des plages de recherche, modifiables par le chercheur.
#
# ARÈNE : chaque stratégie activée trade dans son propre portefeuille fantôme (1 000 virtuels,
# vrais carnets). Le capital principal suit automatiquement le champion choisi par
# src/polymarket_agent/arena.py (seuils d'entrée et de maintien : config/promotion.yaml).
# Au moins 3 idées doivent être en test en permanence ; la pire est éliminée chaque semaine.

naive_favorite:
  explication: "On achète la réponse que tout le monde donne gagnante, en pariant qu'elle gagne encore un peu plus souvent que ce que dit son prix."
  # Référence naïve. Perd sur l'historique (v2 validation −9 %, test −21 %) : sert de repère
  # dans l'arène (si elle finit devant, les autres ne valent rien).
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-14"
  hypothesis: >
    Stratégie de RÉFÉRENCE définie à l'avance (pas une stratégie supposée rentable).
    Hypothèse « biais favori / outsider » : le favori d'un marché binaire proche de son
    échéance serait légèrement sous-évalué. Le biais est un a priori NON calibré ;
    il sera mesuré, et la stratégie abandonnée si les résultats ne le confirment pas.
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
    # borne basse = milieu + biais − incertitude = milieu + 0,035 : il faut au moins
    # 0,02 de marge après le demi-écart et les frais, sinon aucune position n'est possible.
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.02, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}   # 1 = Kelly complet (croissance maximale)

naive_favorite_large:
  explication: "Comme le favori de base, mais on accepte aussi les favoris moins sûrs (à partir de 65 % de chances), pour voir s'il y a de l'argent à gagner plus bas."
  # Variante « large » (17/10/2026, chercheur) de la meilleure de l'arène (naive_favorite : 9 opérations,
  # +84). Même idée, fourchette de prix élargie (0,65-0,97) au lieu de 0,80-0,95 : plus d'occasions,
  # donc un échantillon qui se remplit plus vite. Sans nouveau code (class:). Fantôme : ne coûte rien.
  class: naive_favorite
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-17"
  hypothesis: >
    Le biais favori mesuré (experiments/favori.md) se limite-t-il à 0,85-0,97 ? On élargit vers le bas
    pour voir où il disparaît, en direct, aux vrais carnets. Comparée à naive_favorite dans l'arène.
  params:
    min_ask:        {value: 0.65, min: 0.50, max: 0.97}
    max_ask:        {value: 0.97, min: 0.60, max: 0.98}
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.02, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}

reversion:
  explication: "Quand un prix a bougé très vite, on parie qu'il va revenir un peu en arrière, comme un élastique."
  enabled: false   # coupée le 17/10/2026 (AMELIORATION n°5) : −30 % sur 7 opérations (Kelly complet sur des paris perdants)
  version: "1.0.0"
  created_at: "2026-10-14"
  table: reversion_v1.json
  hypothesis: >
    Mean reversion conditionnelle : après un mouvement du favori >= 0,10 en 6 h, le prix
    surréagit. Table ajustée sur l'entraînement v2 (historique non biaisé). Résultats de
    backtest jugés NON fiables (effet concentré dans des marchés minuscules où le prix
    historique n'est pas exécutable) : d'où le mode fantôme sur de vrais carnets.
  params:
    min_move:        {value: 0.10, min: 0.05, max: 0.30}
    min_changes_24h: {value: 4, min: 4, max: 24}
    min_events:      {value: 150, min: 150, max: 5000}
    min_net_edge:    {value: 0.02, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}   # 1 = Kelly complet (croissance maximale)

calibration:
  explication: "On regarde sur le passé si les prix disent vrai (un prix de 0,70 gagne-t-il 7 fois sur 10 ?) et on achète ce qui est trop bon marché."
  # v1 rejetée (biais de sélection) ; v2 échoue au critère 1 en validation, mais l'arène la
  # juge en conditions réelles.
  enabled: false   # éliminée par l'arène (−388 € en 46 opérations, 22 gagnés pour 28,3 attendus) ; coupée le 20/10/2026 (chercheur)
  version: "2.0.0"
  created_at: "2026-10-14"
  table: calibration_v2.json
  params:
    min_events:      {value: 150, min: 150, max: 5000}
    min_net_edge:    {value: 0.02, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}   # 1 = Kelly complet (croissance maximale)

crypto_threshold:
  explication: "On calcule avec des maths la chance que le Bitcoin dépasse un prix et on achète si le marché se trompe (en pause : ça ne marchait pas)."
  # Étape 5 : probabilité indépendante pour les marchés crypto à seuil (prix au comptant +
  # volatilité réalisée, modèle log-normal ; crypto_model.py). Jugée par l'arène en réel.
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-15"
  params:
    min_net_edge:    {value: 0.03, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    # En pause le 16/10/2026 : aucun avantage aux prix réellement payés (experiments/crypto_backtest.md,
    # règle de production −6 à −48 % des mises sur les deux moitiés) ; −150 dans l'arène.
    max_proposals_per_cycle: {value: 0, min: 0, max: 50}
    max_quote_age_minutes: {value: 20, min: 1, max: 120}
    min_hours:       {value: 0.5, min: 0.1, max: 72}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}   # 1 = Kelly complet

# ---------------------------------------------------------------- étape 6 : 5 nouvelles familles
cross_market:
  explication: "Quand deux marchés liés se contredisent, on achète les deux côtés pour gagner à coup sûr."
  # Stratégie 7 : incohérences entre marchés liés (échelles de seuils) → arbitrage sans risque.
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-15"
  params:
    min_net_edge:   {value: 0.005, min: 0.0, max: 0.10}   # marge garantie par paire
    stake_fraction: {value: 0.20, min: 0.0, max: 1.0}     # sans risque : grosse mise
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}

market_structure_patiente:
  explication: "La même idée, mais on attend dans la file qu'un vendeur vienne à notre prix."
  # Variante du 15/10/2026 (chercheur) : market_structure paie le vendeur (frais taker + écart) et
  # perd (53 opérations, -145, frais > moitié du résultat). Ici : achat POSÉ 1 cran au-dessus du
  # meilleur acheteur, déséquilibre plus exigeant, objectif de gain plus large (0,04) que les frais.
  class: market_structure
  limit_ticks: 1
  enabled: false   # coupée le 17/10/2026 (AMELIORATION n°5) : −19 % sur 45 opérations ; la stratégie mère (−49 %) est déjà arrêtée
  version: "1.0.0"
  created_at: "2026-10-15"
  params:
    min_imbalance:  {value: 0.7, min: 0.2, max: 0.95}
    max_spread:     {value: 0.03, min: 0.001, max: 0.10}
    depth_window:   {value: 0.03, min: 0.005, max: 0.20}
    stake_fraction: {value: 0.05, min: 0.0, max: 1.0}
    take_profit:    {value: 0.04, min: 0.001, max: 0.30}
    stop_loss:      {value: 0.04, min: 0.001, max: 0.50}
    max_hold_hours: {value: 12, min: 0.1, max: 72}
    max_extra_ticks: {value: 0, min: 0, max: 5}
    max_proposals_per_cycle: {value: 2, min: 0, max: 50}

calibration_patiente:
  explication: "La même idée que « calibration », mais on attend dans la file au lieu de payer le prix du vendeur."
  # Variante « patiente » (ordres à cours limité, 15/10/2026) : même modèle que calibration,
  # mais au lieu d'acheter au vendeur elle POSE un achat 1 cran au-dessus du meilleur acheteur.
  # Hypothèse : économiser l'écart et les frais taker vaut plus que les occasions manquées.
  # « class » : réutilise le code d'une stratégie existante sous un autre nom (son propre fantôme).
  # « limit_ticks » : active le mode patient (0 = rejoindre le meilleur acheteur).
  class: calibration
  limit_ticks: 1
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-15"
  table: calibration_v2.json
  params:
    min_events:      {value: 150, min: 150, max: 5000}
    min_net_edge:    {value: 0.00, min: 0.00, max: 0.50}   # avantage mesuré au vendeur ; le prix posé est meilleur
    max_extra_ticks: {value: 0, min: 0, max: 5}
    max_proposals_per_cycle: {value: 5, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}

