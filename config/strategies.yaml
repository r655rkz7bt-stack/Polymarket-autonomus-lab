  # 22/10/2026 (enquête 2026-10-22_soir_mises_geantes_et_types.md) : le biais fixe de 0,05 a mené nf_court_prix_haut à miser 489 € (53 % de son capital)
  # puis 498 € (48 %) sur un seul pari à 0,946 / 0,94 ; sur les 89 paris de fantômes de plus de 200 €, 79 gagnés pour 81,4 attendus par les prix (−2,6 %).
