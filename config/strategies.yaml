# ---------------------------------------------------------------- favori : chaque raison testée à part
# Étude du 16/10/2026 (experiments/favori.md, 16 680 marchés résolus, prix réellement payés) :
# en moyenne le favori est TROP cher (−2 à −4 % après frais) ; il ne gagne que dans des poches.
# Chaque variante isole une raison ; naive_favorite (d'origine) reste le point de comparaison.

favori_politique:
  explication: "On achète le favori, mais seulement en politique, où les favoris gagnent plus souvent que leur prix ne le dit."
  # Raison n°1 : en politique et géopolitique, le favori perd ~70 % moins souvent que son prix
  # ne l'annonce (0,85-0,97 : 97,6 % de réussite pour un prix moyen de 0,922 ; +5,7 % après
  # frais ; 47 jours gagnants sur 54, 110 événements, les deux moitiés de la période positives,
  # +4,8 % avec 1 centime d'écart en plus). Explications possibles : partisans qui paient leur
  # candidat, goût du scénario spectaculaire, peu de bots rapides, argent immobilisé longtemps.
  class: naive_favorite
  familles: [politics, sans_frais]
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-16"
  params:
    min_ask:        {value: 0.85, min: 0.50, max: 0.99}  # 0,80-0,85 : écart faible (+1,5 pt)
    max_ask:        {value: 0.97, min: 0.60, max: 0.99}
    bias:           {value: 0.0, min: 0.00, max: 0.06}   # remplacé par shrink
    shrink:         {value: 0.5, min: 0.0, max: 0.9}     # sous l'écart mesuré (0,70 ; 0,82 à 0,95-0,98)
    uncertainty:    {value: 0.01, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.01, min: 0.00, max: 0.50}
    min_hours:      {value: 6, min: 0, max: 720}         # pas les dernières heures
