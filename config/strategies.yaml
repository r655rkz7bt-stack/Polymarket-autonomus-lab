    NWH 2,14-2,20 → chance 0,09 (week-end 360 M$, ×2,15) à 0,44 (prix du week-end, ×2,35). Aucun test sur le passé (un seul cas
    comparable, 2015, sans marché). Billets sous 0,10 exclus : elle n'achète que si le prix de l'année monte à 0,10 ou plus, ou
    après le premier week-end (tranche réglée le 20-21/12, loi bien plus serrée). Une perte apprendrait qu'un record d'ouverture
    est plus concentré sur ses premiers jours que les sorties de Noël passées (multiplicateur < 2,2), ou que le marché du
    premier week-end surestimait.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance (borne basse) − prix demandé − frais
    uncertainty:    {value: 0.15, min: 0.0, max: 0.30}    # multiplicateur 2,1-2,6 : borne basse = chance − 0,15
    min_price:      {value: 0.10, min: 0.01, max: 0.50}   # pas de billets sous 0,10 (règle « audace »)
    max_price:      {value: 0.90, min: 0.50, max: 0.99}
    max_stale_hours: {value: 3, min: 0.1, max: 24}        # source relue toutes les heures
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 10, min: 0, max: 200}
    max_proposals_per_cycle: {value: 1, min: 0, max: 20}
    max_per_event:  {value: 1, min: 1, max: 10}           # un seul tirage : Doomsday dépasse ou non
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}      # demi-Kelly sur la borne basse : un seul événement

tornades_mois:
  explication: "Polymarket demande combien de tornades il y aura aux États-Unis ce mois-ci. Le service météo américain publie chaque jour la liste des tornades, et c'est elle qui décide : on compte celles déjà passées, on ajoute ce qui arrive d'habitude le reste du mois, et on parie sur la tranche que le marché cote mal."
  class: tornades_mois
  enabled: false   # 11/11/2026 : éteinte dès sa création ; aux prix payés l'avantage n'est pas démontré (t < 1, fin de mois −70 % sur 4-5 paris) et la loi ignore les perspectives du SPC. La source `tornades` garde le compte tel que publié : rallumer après un test sans regard vers le futur (experiments/tornades.md).
  version: "2.0.0"
  created_at: "2026-11-11"
  hypothesis: >
    Expérience, lire la source de règlement avant la fin du mois (experiments/tornades.md, 11/11/2026, piste n° 21). La valeur NCEI qui règle =
    la somme des rapports filtrés du SPC (identiques janvier-septembre 2026). 10 mois réglés, 65 tranches : log-loss 0,33 contre 0,42 au jour 5 ;
    aux vrais prix (seuil 0,05) 11-14 paris, gagnés 7-8 pour 7,2-8,7 attendus, +7 à +27 % selon la correction des rapports tardifs, t par mois
    0,5-0,6 : INDICE FAIBLE (9 réglages essayés). La source garde le compte tel qu'il était publié (`n0`) : dans 2-3 mois, test sans regard vers le
    futur. Une perte apprendrait que la climatologie 1995-2024 ne vaut pas les perspectives du SPC, ou que les carnets minces ne s'achètent pas.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}
    uncertainty:    {value: 0.03, min: 0.0, max: 0.30}
    min_price:      {value: 0.05, min: 0.01, max: 0.50}
    max_price:      {value: 0.93, min: 0.50, max: 0.99}
    max_stale_hours: {value: 6, min: 0.5, max: 24}       # relevé toutes les 3 h
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 20, min: 0, max: 100}
    max_proposals_per_cycle: {value: 2, min: 0, max: 10}
    max_per_event:  {value: 2, min: 1, max: 10}           # tranches d'un même mois : exclusives, perdent ensemble
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}

lid_agenda:
  explication: "Chaque jour, un marché demande si la Maison-Blanche annoncera la fin de journée du Président (le « lid ») avant 18 h 30. On lit son agenda publié la veille : journée calme sans voyage, le lid tombe tôt presque toujours ; journée de voyage qui finit tard, presque jamais. On parie quand le marché ne l'a pas vu."
  class: lid_agenda
  enabled: true
  version: "2.0.0"
  created_at: "2026-11-10"
  hypothesis: >
    Expérience audacieuse, lire la source de résolution (experiments/lid_agenda.md, 10/11/2026). 210 marchés réglés (février → novembre 2026) ;
    règlement = premier « Travel/Photo lid called » de Roll Call Factbase (199/210). Agenda (607 jours) : sans voyage et dernier rendez-vous avant
    17 h → 86 % (84 % puis 89 %) ; voyage et dernier rendez-vous ≥ 17 h → 14 % (14 % puis 14 %) ; le marché cotait ces cases 0,73 et 0,22 à 12 h.
    MAIS l'agenda archivé est l'agenda final (regard vers le futur possible) et les prix horaires sont rarement des prix exécutés (19 vrais
    achats au mieux) : indice, pas preuve. Une perte apprendrait que l'agenda de la veille ne vaut pas l'agenda final, ou que les carnets
    n'offrent pas ces prix.
  params:
    min_net_edge:   {value: 0.05, min: 0.0, max: 0.30}    # chance − prix demandé − frais
    uncertainty:    {value: 0.04, min: 0.0, max: 0.30}    # borne basse = chance − 0,04
    min_price:      {value: 0.05, min: 0.01, max: 0.50}
    max_price:      {value: 0.92, min: 0.50, max: 0.99}
    max_stale_hours: {value: 1, min: 0.1, max: 24}
    min_hours:      {value: 0.5, min: 0.0, max: 24}       # avant l'heure limite
    max_hours:      {value: 30, min: 1, max: 96}          # l'agenda du jour sort la veille au soir
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_candidates: {value: 10, min: 0, max: 50}
    max_proposals_per_cycle: {value: 2, min: 0, max: 10}
    kelly_fraction: {value: 0.5, min: 0.0, max: 2.0}      # demi-Kelly sur la borne basse : expérience franche, un pari par jour

non_aux_drames:
  explication: "Les gens paient trop cher le frisson d'une catastrophe lointaine (une invasion, un président renversé) : on parie qu'elle n'arrivera pas, avec une petite mise."
  class: non_aux_drames
  enabled: true
  version: "2.0.0"
  created_at: "2026-10-23"
  hypothesis: >
    Piste n° 11 revue (experiments/pistes_crypto_elections_drames.md) : NON des « drames » (liste de mots
    fixée avant les résultats) à OUI 2-15 %, 30 à 120 jours avant l'échéance : 149 paris 2024-2026, +4,6 %
    par pari aux prix payés, 2 drames pour 9,3 attendus, t par événement 2,81 ; témoin non-drames +0,9 %.
    Le chercheur l'avait écartée sur TOUS les marchés longs (+1,7 à +2,8 %, experiments/non_aux_drames.md) :
    l'effet est sur les drames. 2 % du capital par événement ; arrêter si deux drames arrivent le même mois.
