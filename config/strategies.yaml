# ---------------------------------------------------------------- ENTONNOIR (17/10/2026)
# Décision d'Etienne : découper chaque stratégie qui gagne en morceaux (« filles ») pour voir quel
# morceau fait vraiment gagner. Chaque fille = la mère, mêmes réglages, sur UN morceau des marchés
# (`filtres`, voir strategy_engine.Filtered). Le tableau de bord (bloc « Entonnoir ») compare
# chaque fille à sa mère. Étape suivante : combiner les morceaux gagnants (familles + prix + délai).
# Dissection des paris déjà faits : experiments/dissection/dissequer.py.

nf_sport:
  explication: "Comme naive_favorite, mais seulement le sport."
  mere: naive_favorite
  morceau: "sport"
  class: naive_favorite
  filtres: {familles: [sports]}
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-17"
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
    # borne basse = milieu + biais − incertitude = milieu + 0,035 : il faut au moins
    # 0,02 de marge après le demi-écart et les frais, sinon aucune position n'est possible.
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.02, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}   # 1 = Kelly complet (croissance maximale)

nf_sport_patiente:
  explication: "Le favori de sport (la meilleure fille pour l'instant), mais en posant l'achat et en attendant un vendeur, pour payer moins cher."
  # Petite-fille d'essai (17/10/2026, chercheur) : morceau gagnant « sport » (nf_sport, 3 opérations,
  # +32) combiné au mode patient (ordre posé 1 cran au-dessus du meilleur acheteur). Fantôme : gratuit.
  mere: naive_favorite
  morceau: "sport, patiente"
  class: naive_favorite
  limit_ticks: 1
  # 21/10/2026 (AMELIORATION n°2, décision d'Etienne) : jamais d'ordre posé servi sous 0,80 (−11,9 % sur 44 paris,
  # experiments/enquetes/2026-10-21_posees_sous_la_plage.md) : `prix_final` = la plage porte sur le prix de l'ordre posé.
  filtres: {familles: [sports], prix_min: 0.80, prix_final: true}
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-17"
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.01, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}

nf_sport_patiente_biais_faible:
  explication: "Le favori de sport en posant l'achat, mais en croyant à un petit avantage (3 points au lieu de 5) : les mises restent raisonnables quand le prix est haut."
  # 22/10/2026 (enquête 2026-10-22_championne_biais_et_mises.md) : le biais fixe de 0,05 fait grossir la mise comme 1/(1 − prix)
  # (45 % du capital d'un fantôme sur un seul pari à 0,924, le 22/10 à 14 h 05) alors que 530 favoris de sport ont gagné autant que leur prix.
  # Sœur de la championne (pas une fille : la mère en a déjà 10) à comparer sur la MÊME période, mêmes filtres.
  morceau: "sport, patiente, biais 0,03"
  class: naive_favorite
  limit_ticks: 1
  filtres: {familles: [sports], prix_min: 0.80, prix_final: true}
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-22"
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
