meteo_prevision_patiente:
  explication: "La même idée météo, mais on attend dans la file qu'un vendeur vienne à notre prix."
  # Variante « patiente » (16/10/2026, chercheur) : même modèle que meteo_prevision (seule
  # stratégie avec un avantage mesuré hors échantillon), mais l'achat de « Non » est POSÉ
  # 1 cran au-dessus du meilleur acheteur au lieu de payer le vendeur. Hypothèse : l'écart et
  # les frais taker mangent une part notable des ≈ +20 % du test ; mieux vaut rater quelques
  # paris que tous les payer plein tarif. Mise un peu plus forte, car moins de paris exécutés.
  class: meteo_prevision
  limit_ticks: 1
  enabled: false  # éliminée par l'arène (22/10/2026) : remplacée, voir experiments/journal_recherche.md
  version: "1.0.0"
  created_at: "2026-10-16"
  params:
    min_net_edge:   {value: 0.03, min: 0.0, max: 0.30}
    margin:         {value: 0.02, min: 0.0, max: 0.20}
    sigma_max:      {value: 1.5, min: 0.3, max: 4.0}
    bias_max:       {value: 0.5, min: -3.0, max: 3.0}
    sigma_min:      {value: 1.8, min: 0.3, max: 4.0}
    bias_min:       {value: 0.0, min: -3.0, max: 3.0}
    max_lead_hours: {value: 36, min: 0, max: 72}
    min_lead_hours: {value: 6, min: 0, max: 24}
    min_no_price:   {value: 0.2, min: 0.01, max: 0.99}
    max_no_price:   {value: 0.8, min: 0.01, max: 0.99}
    allow_yes:      {value: 0, min: 0, max: 1}
    max_candidates: {value: 100, min: 0, max: 400}
    kelly_fraction: {value: 0.35, min: 0.0, max: 5.0}
    stake_fraction: {value: 0.05, min: 0.0, max: 1.0}
    # Étalonnage PAR STATION (16/10/2026, experiments/meteo_backtest.md) : biais et flou appris sur
    # les 7 derniers jours de la station, tirés vers les réglages ci-dessus. Prévision plus juste
    # (Brier 0,090 au lieu de 0,097) ; mais aux prix réellement payés, aucun avantage mesuré sur le
    # passé (−6 %) : seule l'arène, sur les vrais carnets, tranchera.
    station_calibration:  {value: 1, min: 0, max: 1}
    calibration_days:     {value: 7, min: 1, max: 30}
    calibration_min_days: {value: 3, min: 1, max: 30}
    calibration_shrink:   {value: 3, min: 0, max: 30}  # jours « fictifs » au réglage global
    sigma_floor:          {value: 0.8, min: 0.2, max: 3.0}
    max_extra_ticks: {value: 0, min: 0, max: 5}
    max_proposals_per_cycle: {value: 8, min: 0, max: 50}

crypto_threshold_patiente:
  explication: "La même idée Bitcoin, en attendant dans la file (en pause)."
  # Variante « patiente » (16/10/2026 soir, chercheur) de crypto_threshold (4 opérations, -150 :
  # achats payés au vendeur, écart + frais taker). Achat posé 1 cran au-dessus du meilleur
  # acheteur, seuil d'avantage abaissé car le prix posé est meilleur que celui du vendeur,
  # mise réduite de moitié (Kelly 0,5) : la surconfiance du modèle log-normal a coûté cher.
  class: crypto_threshold
  limit_ticks: 1
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-16"
  params:
    min_net_edge:    {value: 0.02, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 0, min: 0, max: 5}
    # En pause le 16/10/2026 (même test) : le modèle n'a pas d'information que le marché n'a pas,
    # ses ordres posés seraient surtout exécutés quand le marché va contre lui.
    max_proposals_per_cycle: {value: 0, min: 0, max: 50}
    max_quote_age_minutes: {value: 20, min: 1, max: 120}
    min_hours:       {value: 0.5, min: 0.1, max: 72}
    kelly_fraction:  {value: 0.5, min: 0.0, max: 5.0}

naive_favorite_patiente:
  explication: "Acheter le favori, mais en attendant dans la file qu'un vendeur vienne à notre prix, pour payer moins cher."
  # Variante « patiente » (16/10/2026 soir, chercheur) de la première de l'arène (naive_favorite :
  # 7 opérations, +79). Achat du favori POSÉ 1 cran au-dessus du meilleur acheteur au lieu de payer
  # le vendeur ; seuil d'avantage abaissé car le prix posé est meilleur ; Kelly 0,5 (échantillon minuscule).
  class: naive_favorite
  limit_ticks: 1
  enabled: false   # coupée le 17/10/2026 (AMELIORATION n°5) : −12,6 % ; ses ordres posés sont servis quand ils ont tort (markout à la résolution −0,94)
  version: "1.0.0"
  created_at: "2026-10-16"
  hypothesis: >
    Même biais favori que naive_favorite ; hypothèse ajoutée : économiser écart et frais taker vaut
    plus que les occasions manquées. Comparée à son jumeau « impatient » dans l'arène.
  params:
