# Tests automatiques sur chaque pull request et chaque push sur main.
# Aucun secret : une pull request ne peut jamais lire LEDGER_KEY ni RESET_CODE.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Dépendances épinglées
        run: python -m pip install -r requirements.txt
      - name: Tests (capital, journal, contrôleur, simulation, verrouillage)
        run: python -m pytest -q
