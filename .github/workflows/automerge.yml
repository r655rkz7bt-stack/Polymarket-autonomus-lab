# Fusion automatique des pull requests de Claude (branches claude/ de ce dépôt).
# La fusion n'a lieu qu'une fois les contrôles exigés par le ruleset de main réussis
# (guard et tests). Par double sécurité, une pull request qui touche un fichier protégé
# n'est jamais mise en fusion automatique : elle reste ouverte pour Etienne.
name: automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Code et règles de main (jamais ceux de la pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fusion automatique si aucun fichier protégé
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          if ! python3 scripts/guard_check.py PROTECTED_PATHS.txt < "$RUNNER_TEMP/changed.txt"; then
            echo "Fichier protégé touché : pas de fusion automatique, la pull request attend Etienne."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash
