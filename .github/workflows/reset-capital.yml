# Réinitialisation manuelle du capital principal, par Etienne seul.
# Lancement : Actions → reset-capital → Run workflow, avec le code RESET_CODE et une raison.
#
# Le code saisi n'apparaît jamais dans les journaux : il est lu depuis le fichier de
# l'événement (pas depuis une variable affichée), masqué immédiatement, puis comparé à temps
# constant par ledger.py (protégé). Par prudence, changer RESET_CODE après chaque utilisation.
name: reset-capital

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code de réinitialisation (RESET_CODE)"
        required: true
        type: string
      reason:
        description: "Raison écrite (inscrite dans le journal signé)"
        required: true
        type: string

permissions: {}

# Jamais en même temps qu'un cycle de simulation.
concurrency:
  group: cycle
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Dépendances épinglées
        run: python -m pip install -r requirements.txt
      - name: Journal (branche data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: _data
      - name: Réinitialisation (code masqué, comparaison à temps constant)
        env:
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          RESET_CODE: ${{ secrets.RESET_CODE }}
          RESET_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          RESET_INPUT=$(jq -r '.inputs.code' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$RESET_INPUT"
          export RESET_INPUT
          mkdir -p ledger state
          cp -a _data/ledger/. ledger/
          if [ -f _data/state/market.sqlite ]; then cp _data/state/market.sqlite state/; fi
          python scripts/reset_capital.py --reason "$RESET_REASON"
          cp -a ledger/. _data/ledger/
          mkdir -p _data/state && cp state/market.sqlite _data/state/
      - name: Enregistrement sur la branche data
        working-directory: _data
        env:
          RESET_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger state
          git commit -m "RESET du capital : $RESET_REASON"
          git push origin HEAD:data
